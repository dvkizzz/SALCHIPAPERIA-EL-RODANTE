<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Salchipaperia El Rodante</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>🍔 El Rodante</h2>
            <nav>
                <ul>
                    <li class="active"><a href="#">📦 Pedidos</a></li>
                    <li><a href="#" id="btn-logout">🚪 Cerrar Sesión</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header>
                <h1>Panel de Control</h1>
                <div class="user-info">Vendedor</div>
            </header>
            <section class="stats-grid">
                <div class="stat-card">
                    <h3>📦 PENDIENTES</h3>
                    <p id="stat-pendientes">0</p>
                </div>
                <div class="stat-card">
                    <h3>🔄 EN PREPARACIÓN</h3>
                    <p id="stat-preparacion">0</p>
                </div>
                <div class="stat-card">
                    <h3>🚚 ENVIADOS</h3>
                    <p id="stat-enviados">0</p>
                </div>
                <div class="stat-card">
                    <h3>💰 VENTAS DEL DÍA</h3>
                    <p id="stat-ventas">S/ 0.00</p>
                </div>
            </section>

            <section class="orders-section">
                <h2>Últimos Pedidos</h2>
                <div class="table-responsive">
                    <table class="orders-table">
                        <thead>
                            <tr>
                                <th>NÚMERO</th>
                                <th>CLIENTE</th>
                                <th>FECHA</th>
                                <th>TOTAL</th>
                                <th>ESTADO</th>
                                <th>ACCIONES</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- Filas inyectadas por JS -->
                            <tr><td colspan="6" class="loading-msg">Cargando pedidos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal Detalles del Pedido -->
    <div id="order-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div id="order-details-content">
                <!-- Contenido inyectado por JS -->
            </div>
            <div class="order-actions" id="order-actions">
                <!-- Botones inyectados por JS según el estado -->
            </div>
        </div>
    </div>

    <!-- Audio de notificación (Opcional, requiere interacción previa en navegadores) -->
    <audio id="notification-sound" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" preload="auto"></audio>

    <script src="js/supabase-client.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
