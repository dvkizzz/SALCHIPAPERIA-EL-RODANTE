<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dashboard El Rodante</title>
    <!-- Importar Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Outfit', sans-serif; margin: 0; padding: 0; }
        body { background-color: #2f3542; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 2.5rem; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
        .login-box h2 { color: #ff4757; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 0.8rem; border: 1px solid #dfe4ea; border-radius: 8px; }
        .btn-login { width: 100%; padding: 1rem; background: #ff4757; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 1rem; }
        .btn-login:hover { background: #ff6b81; }
        #error-msg { color: #ff4757; margin-top: 1rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Dashboard Vendedor</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" value="vikisebastian19z@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" value="rodante2060" required>
            </div>
            <button type="submit" class="btn-login" id="btn-login">Ingresar</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script src="js/supabase-client.js"></script>
    <script>
        // Verificar si ya está logueado
        window.supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const msg = document.getElementById('error-msg');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerText = 'Verificando...';
            msg.innerText = '';

            const { data, error } = await window.supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                msg.innerText = 'Correo o contraseña incorrectos.';
                btn.disabled = false;
                btn.innerText = 'Ingresar';
            } else {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
